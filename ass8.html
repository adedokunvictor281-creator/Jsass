            border: 1px solid #999999;

        }

        .box button {
            width: 100%;
            padding: 10px;
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        }

        .box p {

        <div class="box">
            <h2>Loan Calculator</h2>
            <input type="number" step="1000" min="10000" id="loanAmount" placeholder="Amount to borrow">
            <select id="loanMonths">
                <option value="">Select Duration</option>
                <option value="1">1 MONTH</option>
                <option value="2">2 MONTHS</option>
